name: CI (Fast Path-Filtered)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changed Slices
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.filter.outputs.desktop }}
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            desktop:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'version.json'
              - 'config/**'
              - 'assets/**'
              - 'core/**/rust/**'
              - 'features/**/rust/**'
              - 'apps/desktop/**'
              - '.github/workflows/ci.yml'
            android:
              - 'version.json'
              - 'config/**'
              - 'assets/**'
              - 'core/**/android/**'
              - 'features/**/android/**'
              - 'apps/android/**'
              - '.github/workflows/ci.yml'

  android-ci:
    name: Android Unit Tests & Debug APK
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || needs.changes.outputs.android == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle & Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Run Unit Tests & Assemble Debug APK
        working-directory: apps/android
        env:
          WIREWAVE_BUILD_CHANNEL: dev
        run: |
          chmod +x gradlew
          ./gradlew test :app:assembleDebug --build-cache --parallel --stacktrace

  desktop-rust-ci:
    name: Desktop GPUI Check & Unit Tests (Windows)
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || needs.changes.outputs.desktop == 'true' }}
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always
      CARGO_TARGET_DIR: C:\t
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
      WIREWAVE_BUILD_CHANNEL: dev
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check & Test Workspace
        run: |
          cargo check --workspace --all-targets
          cargo test --workspace --lib
