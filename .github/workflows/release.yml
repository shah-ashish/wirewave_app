name: Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      channel:
        description: 'Distribution channel (dev = in-app updater, store = MS Store / Play Store)'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - store

permissions:
  contents: write

jobs:
  build-android-release:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    env:
      WIREWAVE_BUILD_CHANNEL: ${{ github.event.inputs.channel || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle & Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Android Signing Secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for secret_name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!secret_name}" ]; then
              echo "::error::$secret_name is not configured"
              exit 1
            fi
          done

      - name: Restore Release Keystore from Secret
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore/wirewave-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/keystore/wirewave-release.jks" >> "$GITHUB_ENV"

      - name: Assemble Release APK
        working-directory: apps/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --build-cache --parallel

      - name: Compute APK SHA-256
        run: |
          APK=$(ls apps/android/app/build/outputs/apk/release/*.apk | head -n 1)
          VERSION=$(jq -r .version_name version.json)
          cp "$APK" "WireWave-Android-${VERSION}.apk"
          sha256sum "WireWave-Android-${VERSION}.apk" | awk '{print $1}' > android.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            WireWave-Android-*.apk
            android.sha256

  build-desktop-release:
    name: Build Windows GPUI + NSIS Installer
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always
      CARGO_TARGET_DIR: C:\t
      WIREWAVE_BUILD_CHANNEL: ${{ github.event.inputs.channel || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Release Binary
        run: cargo build --release -p wirewave-desktop

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # CARGO_TARGET_DIR is C:\t, but wirewave.nsi reads the exe from
      # <repo>\target\release (..\..\..\target\release relative to the .nsi).
      # Copy the built binary there so the installer script can find it.
      - name: Stage Release Binary for Installer
        shell: pwsh
        run: |
          $src = Join-Path $env:CARGO_TARGET_DIR "release\wirewave-desktop.exe"
          if (-not (Test-Path $src)) { throw "Release binary not found at $src" }
          New-Item -ItemType Directory -Force -Path "target\release" | Out-Null
          Copy-Item $src "target\release\wirewave-desktop.exe" -Force

      - name: Package NSIS Installer
        shell: pwsh
        run: |
          $version = (Get-Content version.json | ConvertFrom-Json).version_name
          $appName = (Get-Content config/wirewave.config.json | ConvertFrom-Json).app_name
          $outFile = "..\..\..\WireWave-Setup-$version.exe"
          makensis `
            /DAPP_NAME="$appName" `
            /DAPP_VERSION="$version" `
            /DOUT_FILE="$outFile" `
            apps/desktop/installer/wirewave.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed with exit code $LASTEXITCODE" }
          (Get-FileHash "WireWave-Setup-$version.exe" -Algorithm SHA256).Hash.ToLower() | Out-File -Encoding ascii -NoNewline desktop.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-release
          path: |
            WireWave-Setup-*.exe
            desktop.sha256

  publish-release:
    name: Publish GitHub Release & latest.json
    needs: [build-android-release, build-desktop-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: android-release
          path: release-assets

      - uses: actions/download-artifact@v4
        with:
          name: desktop-release
          path: release-assets

      - name: Generate latest.json Manifest
        id: manifest
        run: |
          VERSION_NAME=$(jq -r .version_name version.json)
          VERSION_CODE=$(jq -r .version_code version.json)
          ENDPOINT=$(jq -r .update_endpoint version.json)
          WIN_UPD_ID=$(jq -r .update_app_ids.desktop version.json)
          AND_UPD_ID=$(jq -r .update_app_ids.android version.json)
          WIN_SHA=$(cat release-assets/desktop.sha256)
          AND_SHA=$(cat release-assets/android.sha256)
          echo "tag=v${VERSION_NAME}" >> "$GITHUB_OUTPUT"

          cat <<EOF > release-assets/latest.json
          {
            "version_code": ${VERSION_CODE},
            "version_name": "${VERSION_NAME}",
            "tag": "v${VERSION_NAME}",
            "notes": "WireWave Stage 2 release v${VERSION_NAME}",
            "desktop": {
              "update_app_id": "${WIN_UPD_ID}",
              "download_url": "${ENDPOINT}/download/windows",
              "sha256": "${WIN_SHA}"
            },
            "android": {
              "update_app_id": "${AND_UPD_ID}",
              "download_url": "${ENDPOINT}/download/android",
              "sha256": "${AND_SHA}"
            }
          }
          EOF

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.manifest.outputs.tag }}
          make_latest: true
          generate_release_notes: true
          files: |
            release-assets/*.apk
            release-assets/*.exe
            release-assets/latest.json
