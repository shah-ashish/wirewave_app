[workspace]
resolver = "2"
members = [
    "core/config/rust",
    "core/identity/rust",
    "core/compatibility/rust",
    "core/updater/rust",
    "core/crypto/rust",
    "core/transport/rust",
    "core/discovery/rust",
    "core/session/rust",
    "features/settings/rust",
    "features/connection/rust",
    "core/stream/rust",
    "features/speaker/rust",
    "features/mic/rust",
    "features/mouse/rust",
    "features/camera/rust",
    "features/camera/vcam_dll",
    "apps/desktop",
]

[workspace.package]
version = "1.2.4"
edition = "2024"
authors = ["WireWave Team"]
license = "MIT"

[workspace.dependencies]
gpui = "0.2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
uuid = { version = "1.11", features = ["v4"] }
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
open = "5.3"
directories = "5.0"
hostname = "0.4"
tokio = { version = "1.41", features = ["net", "rt-multi-thread", "sync", "time", "io-util", "macros"] }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = { version = "1.8", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
windows = { version = "0.58", features = [
    "Win32_Devices_Bluetooth",
    "Win32_Foundation",
    "Win32_Media_MediaFoundation",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Input_KeyboardAndMouse",
    "implement",
] }

wirewave-core-config = { path = "core/config/rust" }
wirewave-core-identity = { path = "core/identity/rust" }
wirewave-core-compatibility = { path = "core/compatibility/rust" }
wirewave-core-updater = { path = "core/updater/rust" }
wirewave-core-crypto = { path = "core/crypto/rust" }
wirewave-core-transport = { path = "core/transport/rust" }
wirewave-core-discovery = { path = "core/discovery/rust" }
wirewave-core-session = { path = "core/session/rust" }
wirewave-feature-settings = { path = "features/settings/rust" }
wirewave-feature-connection = { path = "features/connection/rust" }
wirewave-core-stream = { path = "core/stream/rust" }
wirewave-feature-speaker = { path = "features/speaker/rust" }
wirewave-feature-mic = { path = "features/mic/rust" }
wirewave-feature-mouse = { path = "features/mouse/rust" }
wirewave-feature-camera = { path = "features/camera/rust" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
