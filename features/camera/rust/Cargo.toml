[package]
name = "wirewave-feature-camera"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
gpui = { workspace = true }
image = { workspace = true }
open = { workspace = true }
smallvec = "1.13"
tokio = { workspace = true }
tracing = { workspace = true }
wirewave-core-config = { workspace = true }
wirewave-core-session = { workspace = true }
wirewave-core-stream = { workspace = true }
wirewave-core-transport = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Memory",
    "Win32_System_Registry",
] }
